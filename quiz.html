<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz | Tech Monster</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>

<nav class="navbar navbar-dark shadow-sm">
    <div class="container">
        <span class="app-logo">Tech Monster</span>
        <span id="timer" class="fw-bold">5:00</span>
    </div>
</nav>

<div class="container mt-4">
    <div class="glass-card p-4">
        <div class="quiz-live-header mb-3"><div class="d-flex justify-content-between align-items-center"><span id="quizMood">Monster Arena Live</span><span id="quizPercent">0%</span></div><div class="progress quiz-progress mt-2"><div id="quizProgressBar" class="progress-bar"></div></div></div>
        <div id="syllabusTicker" class="syllabus-ticker" style="display:none;">
            <div class="st-head"><span>Syllabus Progress</span><span id="stSummary"></span></div>
            <div id="stTrack" class="st-track"></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 id="questionNumber" class="mb-0"></h5>
            <span id="questionTopic" class="topic-pill">General</span>
        </div>

        <div id="questionImage" class="text-center mb-3" style="display:none;"></div>

        <div id="questionPassage" style="display:none;"></div>
        <div id="questionInstruction" class="question-instruction mb-2" style="display:none;"></div>
        <h4 id="questionText" class="mb-4"></h4>

        <div id="optionsContainer"></div>
        <div id="instantFeedback" class="quiz-feedback"></div>

        <div class="d-flex justify-content-between mt-4">
            <button id="prevBtn" class="secondary-btn">Previous</button>
            <button id="nextBtn" class="glass-btn">Next</button>
        </div>

        <div class="text-center mt-4">
            <button id="submitBtn" class="glass-btn">Submit Quiz</button>
        </div>
    </div>
</div>

<div id="updateNotifier" class="d-none"></div>
<footer class="brand-footer signature-footer"><span class="signature-mark">S&amp;P Group</span><span class="signature-line">Created by S&amp;P Groups • Tech Monster Signature</span> <span id="appVersion" class="text-muted ms-2"></span></footer>

<script src="js/bootstrap.bundle.min.js"></script>
