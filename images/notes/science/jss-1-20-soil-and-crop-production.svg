<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200"><rect width="360" height="200" fill="#eef9ee"/><text x="180" y="18" font-family="Arial" font-size="15" font-weight="bold" fill="#1c5d2a" text-anchor="middle">Types of Soil</text><g font-family="Arial" font-size="11" text-anchor="middle"><text x="60" y="180">Sandy</text><text x="180" y="180">Loamy (best)</text><text x="300" y="180">Clay</text><g><circle cx="55" cy="120" r="5" fill="#d8c49a" opacity="0.9"/><circle cx="62" cy="112" r="5" fill="#d8c49a" opacity="0.9"/><circle cx="68" cy="122" r="5" fill="#d8c49a" opacity="0.9"/></g><g><circle cx="175" cy="118" r="6" fill="#b98a4a"/><circle cx="185" cy="112" r="6" fill="#2b5d34"/><circle cx="192" cy="122" r="6" fill="#b98a4a"/></g><g><circle cx="295" cy="120" r="3" fill="#7a5a2a"/><circle cx="300" cy="114" r="3" fill="#7a5a2a"/><circle cx="306" cy="122" r="3" fill="#7a5a2a"/></g><text x="60" y="60" fill="#555">large particles,</text><text x="60" y="72" fill="#555">drains fast</text><text x="180" y="60" fill="#555">good balance of</text><text x="180" y="72" fill="#555">water & nutrients</text><text x="300" y="60" fill="#555">tiny particles,</text><text x="300" y="72" fill="#555">holds water</text></g></svg>