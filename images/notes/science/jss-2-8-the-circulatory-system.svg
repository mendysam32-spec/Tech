<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220"><rect width="360" height="220" fill="#fff0f0"/><text x="180" y="18" font-family="Arial" font-size="15" font-weight="bold" fill="#901818" text-anchor="middle">Blood & Circulation</text><g font-family="Arial" font-size="12"><g transform="translate(180,110)"><path d="M0,-50 C20,-50 20,-20 0,-12 C-20,-20 -20,-50 0,-50Z" fill="#d83a3a" stroke="#8f1a1a"><animate attributeName="fill" values="#d83a3a;#ff7a7a;#d83a3a" dur="1.2s" repeatCount="indefinite"/></path><text x="0" y="-28" text-anchor="middle" fill="#fff" font-weight="bold">HEART</text><path d="M0,-12 C-55,10 -55,60 -80,90 L-80,95" stroke="#7a2a2a" stroke-width="6" fill="none"/><path d="M0,-12 C55,10 55,60 80,90" stroke="#7a2a2a" stroke-width="6" fill="none"/></g><text x="66" y="60" fill="#7a2a2a">Arteries carry</text><text x="66" y="74" fill="#7a2a2a">blood away</text><text x="270" y="60" fill="#2a5a2a">Veins carry blood</text><text x="270" y="74" fill="#2a5a2a">back to heart</text></g></svg>