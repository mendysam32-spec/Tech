<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240"><rect width="360" height="240" fill="#eef3ff"/><text x="180" y="18" font-family="Arial" font-size="15" font-weight="bold" fill="#203a6b" text-anchor="middle">Animal Cell (Plant cell adds wall & chloroplast)</text><g transform="translate(180,130)"><ellipse rx="90" ry="70" fill="#fffde6" stroke="#c9a227" stroke-width="3" opacity="0.5"/><ellipse rx="55" ry="40" fill="#f5f2ff" stroke="#4444aa" stroke-width="2"/><text font-family="Arial" font-size="11" fill="#203a6b" text-anchor="middle">nucleus</text><circle cx="55" cy="-20" r="8" fill="#8f8" stroke="#2b5d34" stroke-width="1.5"><animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/></circle><text x="75" y="-18" font-family="Arial" font-size="11" fill="#2b5d34">mitochondrion</text></g><g><line x1="70" y1="200" x2="70" y2="60" stroke="#c9a227" stroke-width="2"/><text x="80" y="205" font-family="Arial" font-size="11" fill="#a07817">cell membrane</text></g></svg>