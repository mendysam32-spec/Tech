<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200"><rect width="360" height="200" fill="#eef7ec"/><g font-family="Arial" font-size="13" fill="#2b5d34" text-anchor="middle"><text x="180" y="18" font-size="15" font-weight="bold" fill="#1e3d24">Comparing Living and Non-Living Things</text><text x="90" y="160">LIVING</text><text x="270" y="160">NON-LIVING</text></g><g fill="#5db96b"><circle cx="90" cy="75" r="50" stroke="#2b5d34" stroke-width="2"/><circle cx="270" cy="75" r="50" stroke="#2b5d34" stroke-width="2"/></g><g font-family="Arial" font-size="12" fill="#1e3d24"><text x="90" y="45" text-anchor="middle">Grows</text><text x="90" y="63" text-anchor="middle">Reproduces</text><text x="90" y="81" text-anchor="middle">Respires</text><text x="90" y="99" text-anchor="middle">Feeds</text><text x="270" y="45" text-anchor="middle">Does not grow</text><text x="270" y="63" text-anchor="middle">No feeding</text><text x="270" y="81" text-anchor="middle">No reproduction</text><text x="270" y="99" text-anchor="middle">No respiration</text></g></svg>