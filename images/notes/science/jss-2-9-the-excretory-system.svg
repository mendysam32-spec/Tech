<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200"><rect width="360" height="200" fill="#eef6f2"/><text x="180" y="18" font-family="Arial" font-size="15" font-weight="bold" fill="#17603a" text-anchor="middle">Excretory System</text><g font-family="Arial" font-size="12" fill="#17603a"><rect x="60" y="70" width="80" height="40" rx="10" fill="#c9a227" stroke="#7a5b12"/><text x="100" y="93" text-anchor="middle" fill="#fff">KIDNEY</text><path d="M125 90 L150 90 L150 140 L145 140" stroke="#4a7a5a" stroke-width="5" fill="none"/><text x="160" y="148">Ureter</text><rect x="120" y="150" width="60" height="30" rx="10" fill="#a07bb0" stroke="#5b3a6a"/><text x="150" y="169" text-anchor="middle" fill="#fff">Bladder</text></g><g font-family="Arial" font-size="11" fill="#17603a"><text x="200" y="85">The kidney filters</text><text x="200" y="100">waste (urea) from</text><text x="200" y="115">the blood to make urine</text><text x="200" y="135">Small tubes (ureter)</text><text x="200" y="150">carry urine to the bladder</text></g></svg>