<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200"><rect width="360" height="200" fill="#e9f6ef"/><text x="180" y="18" font-family="Arial" font-size="15" font-weight="bold" fill="#17603a" text-anchor="middle">Types of Pollution</text><g font-family="Arial" font-size="12" text-anchor="middle"><rect x="15" y="45" width="100" height="110" rx="8" fill="#b8a28a"/><text x="65" y="72">Air</text><text x="65" y="92">smoke, dust,</text><text x="65" y="106">exhaust gases</text><text x="65" y="140">💨</text><rect x="130" y="45" width="100" height="110" rx="8" fill="#79aade"/><text x="180" y="72">Water</text><text x="180" y="92">sewage, oil,</text><text x="180" y="106">chemicals</text><text x="180" y="140">🌊</text><rect x="245" y="45" width="100" height="110" rx="8" fill="#c9a227"/><text x="295" y="72">Land/Soil</text><text x="295" y="92">plastics,</text><text x="295" y="106">chemical waste</text><text x="295" y="140">🗑️</text></g></svg>