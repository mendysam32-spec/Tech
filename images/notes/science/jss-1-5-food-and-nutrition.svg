<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220"><rect width="360" height="220" fill="#fff7ec"/><text x="180" y="20" font-family="Arial" font-size="15" font-weight="bold" fill="#8a4d12" text-anchor="middle">Six Classes of Food</text><g font-family="Arial" font-size="12" text-anchor="middle"><rect x="15" y="45" width="105" height="130" rx="8" fill="#f4c971"/><text x="67" y="75">Carbohydrate</text><text x="67" y="92" fill="#555">Energy</text><text x="67" y="160" fill="#666">yam, rice,</text><text x="67" y="174" fill="#666">fufu, bread</text><rect x="128" y="45" width="105" height="130" rx="8" fill="#e88a6a"/><text x="180" y="75">Protein</text><text x="180" y="92" fill="#555">Build/repair</text><text x="180" y="160" fill="#666">meat, egg,</text><text x="180" y="174" fill="#666">beans, milk</text><rect x="241" y="45" width="105" height="130" rx="8" fill="#79aade"/><text x="293" y="75">Vitamins</text><text x="293" y="92" fill="#555">Protection</text><text x="293" y="160" fill="#666">fruits,</text><text x="293" y="174" fill="#666">vegetables</text></g></svg>