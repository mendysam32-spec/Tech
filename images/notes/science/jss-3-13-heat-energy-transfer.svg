<svg xmlns="http://www.w3.org/2000/svg" width="360" height="190" viewBox="0 0 360 190"><rect width="360" height="190" fill="#fff0f0"/><text x="180" y="18" font-family="Arial" font-size="15" font-weight="bold" fill="#8a1a1a" text-anchor="middle">Three Ways Heat Travels</text><g font-family="Arial" font-size="12" text-anchor="middle"><rect x="20" y="40" width="95" height="120" rx="8" fill="#ffe0c0"/><text x="67" y="70">Conduction</text><text x="67" y="90">through solids</text><text x="67" y="110">e.g. metal rod</text><text x="67" y="145">🥄</text><rect x="132" y="40" width="96" height="120" rx="8" fill="#cfe3f5"/><text x="180" y="70">Convection</text><text x="180" y="90">in liquids/gases</text><text x="180" y="110">e.g. boiling water</text><text x="180" y="145">🍲</text><rect x="245" y="40" width="95" height="120" rx="8" fill="#fff3b0"/><text x="292" y="70">Radiation</text><text x="292" y="90">no medium</text><text x="292" y="110">e.g. sun&apos;s heat</text><text x="292" y="145">☀️</text></g></svg>