<text x="465" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Topic sentence</text><line x1="24" y1="204" x2="736" y2="204" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="220" r="6" fill="#2563eb"/><text x="48" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Literal comprehension: the answer is stated directly in the passage.</text><circle cx="32" cy="253" r="6" fill="#2563eb"/><text x="48" y="259" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Inferential comprehension: the answer is implied and must be worked out from</text><text x="48" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">clues.</text><circle cx="32" cy="307" r="6" fill="#2563eb"/><text x="48" y="313" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Evaluative (critical) comprehension: you must judge, compare, or give an</text><text x="48" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">opinion justified by the passage.</text><circle cx="32" cy="361" r="6" fill="#2563eb"/><text x="48" y="367" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Main idea questions: find the topic sentence and the title of the passage.</text><circle cx="32" cy="394" r="6" fill="#2563eb"/><text x="48" y="400" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Detail questions: answers are stated word for word or nearly so.</text><circle cx="32" cy="427" r="6" fill="#2563eb"/><text x="48" y="433" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Vocabulary-in-context questions: replace the word with a guess that fits the</text><text x="48" y="454" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">sentence.</text></svg>