<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img"><rect width="760" height="560" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient></defs>
<path d="M0 22 A22 22 0 0 1 22 0 L738 0 A22 22 0 0 1 760 22 L760 58 L0 58 Z" fill="url(#band)"/>
<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Idioms and Proverbs</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 8 • Topic 13</text><rect x="24" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Idiom</text><rect x="202" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Proverb</text><rect x="380" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Paraphrase</text><rect x="558" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="643" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Literal meaning</text><line x1="24" y1="148" x2="736" y2="148" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="164" r="6" fill="#2563eb"/><text x="48" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">An idiom's meaning is fixed and cannot be worked out word by word: 'to rain</text><text x="48" y="191" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">cats and dogs'.</text><circle cx="32" cy="218" r="6" fill="#2563eb"/><text x="48" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Common idiom types: simile, metaphor-like idioms, verb idioms, adjective</text><text x="48" y="245" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">idioms, proverbs.</text><circle cx="32" cy="272" r="6" fill="#2563eb"/><text x="48" y="278" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Verb idioms: 'to give up', 'to look forward to', 'to put off', 'to bring up',</text><text x="48" y="299" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">'to carry out'.</text><circle cx="32" cy="326" r="6" fill="#2563eb"/><text x="48" y="332" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Adjective idioms: 'in a hurry', 'in a mess', 'at ease', 'in the mood'.</text><circle cx="32" cy="359" r="6" fill="#2563eb"/><text x="48" y="365" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Idioms with 'the': 'the same old story', 'the last straw', 'the apple of my</text><text x="48" y="386" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">eye'.</text><circle cx="32" cy="413" r="6" fill="#2563eb"/><text x="48" y="419" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Proverbs are complete sentences with a moral: 'When the going gets tough, the</text><text x="48" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">tough get going.'</text></svg>