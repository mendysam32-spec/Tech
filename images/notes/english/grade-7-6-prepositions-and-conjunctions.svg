<text x="287" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Clause</text><line x1="24" y1="204" x2="736" y2="204" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="220" r="6" fill="#2563eb"/><text x="48" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Prepositions of time: at (a point), on (a day or date), in (a month, year,</text><text x="48" y="247" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">season, longer period).</text><circle cx="32" cy="274" r="6" fill="#2563eb"/><text x="48" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Prepositions of place: at (a point), on (a surface), in (an enclosed space).</text><circle cx="32" cy="307" r="6" fill="#2563eb"/><text x="48" y="313" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Prepositions of movement: to, from, towards, into, onto, out of, through,</text><text x="48" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">across, over, under, past, along.</text><circle cx="32" cy="361" r="6" fill="#2563eb"/><text x="48" y="367" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Prepositions of direction: towards, up, down, into, onto, off, out, away from,</text><text x="48" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">back to.</text><circle cx="32" cy="415" r="6" fill="#2563eb"/><text x="48" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Common fixed phrases: in a hurry, on time, at last, by bus, with a knife, at</text><text x="48" y="442" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">school, in bed.</text><circle cx="32" cy="469" r="6" fill="#2563eb"/><text x="48" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Prepositions of time with special words: in the morning, at night, on Monday,</text><text x="48" y="496" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">at Christmas, in July.</text></svg>