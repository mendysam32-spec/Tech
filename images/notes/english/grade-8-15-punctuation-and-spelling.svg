<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img"><rect width="760" height="560" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient></defs>
<path d="M0 22 A22 22 0 0 1 22 0 L738 0 A22 22 0 0 1 760 22 L760 58 L0 58 Z" fill="url(#band)"/>
<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Punctuation and Spelling</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 8 • Topic 15</text><rect x="24" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Punctuation</text><rect x="202" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Apostrophe</text><rect x="380" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Full stop</text><rect x="558" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="643" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Comma</text><rect x="24" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Direct speech</text><line x1="24" y1="204" x2="736" y2="204" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="220" r="6" fill="#2563eb"/><text x="48" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A full stop ends a complete sentence: 'We walked to school. We had lunch at</text><text x="48" y="247" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">noon.'</text><circle cx="32" cy="274" r="6" fill="#2563eb"/><text x="48" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A comma separates items in a list: 'We bought bread, milk and eggs.'</text><circle cx="32" cy="307" r="6" fill="#2563eb"/><text x="48" y="313" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A comma separates a subordinate clause at the start of a sentence: 'When the</text><text x="48" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">bell rang, we left.'</text><circle cx="32" cy="361" r="6" fill="#2563eb"/><text x="48" y="367" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A comma is not placed between a subject and its verb: ✗ 'The boy, who is ten,</text><text x="48" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">plays' -&gt; ✓ 'The boy who is ten plays'.</text><circle cx="32" cy="415" r="6" fill="#2563eb"/><text x="48" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Every sentence begins with a capital letter, and every proper noun is</text><text x="48" y="442" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">capitalised.</text><circle cx="32" cy="469" r="6" fill="#2563eb"/><text x="48" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">The pronoun 'I' is always capitalised, and 'I' is always the subject.</text></svg>