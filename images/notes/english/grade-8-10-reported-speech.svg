<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Reported Speech</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 8 • Topic 10</text><rect x="24" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Direct speech</text><rect x="202" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Reported (indirect…</text><rect x="380" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Reporting verb</text><rect x="558" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="643" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Backshift (sequenc…</text><line x1="24" y1="148" x2="736" y2="148" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="164" r="6" fill="#2563eb"/><text x="48" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Reporting verbs: said, told, explained, complained, admitted, warned,</text><text x="48" y="191" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">suggested, replied, announced, argued.</text><circle cx="32" cy="218" r="6" fill="#2563eb"/><text x="48" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Step 1: change the pronouns to match the reporter and the new listener.</text><circle cx="32" cy="251" r="6" fill="#2563eb"/><text x="48" y="257" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Step 2: change the tense (usually one step back into the past).</text><circle cx="32" cy="284" r="6" fill="#2563eb"/><text x="48" y="290" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Step 3: change time and place expressions (today -&gt; that day, tomorrow -&gt; the</text><text x="48" y="311" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">next day, here -&gt; there, this -&gt; that).</text><circle cx="32" cy="338" r="6" fill="#2563eb"/><text x="48" y="344" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Reporting verbs that do NOT take 'that': say, admit, complain, announce,</text><text x="48" y="365" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">explain, reply, argue, shout.</text><circle cx="32" cy="392" r="6" fill="#2563eb"/><text x="48" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Reporting verbs that require 'that': state, explain, announce, mention,</text><text x="48" y="419" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">insist, argue, suggest.</text></svg>