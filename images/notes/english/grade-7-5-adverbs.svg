<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img"><rect width="760" height="560" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient></defs>
<path d="M0 22 A22 22 0 0 1 22 0 L738 0 A22 22 0 0 1 760 22 L760 58 L0 58 Z" fill="url(#band)"/>
<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Adverbs</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 7 • Topic 5</text><rect x="24" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Adverb</text><rect x="202" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Adverb of manner</text><rect x="380" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Adverb of place</text><rect x="558" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="643" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Adverb of time</text><rect x="24" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Adverb of frequency</text><rect x="202" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Adverb of degree</text><rect x="380" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Flat adverb</text><line x1="24" y1="204" x2="736" y2="204" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="220" r="6" fill="#2563eb"/><text x="48" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">An adverb of manner answers HOW, e.g. She sings beautifully.</text><circle cx="32" cy="253" r="6" fill="#2563eb"/><text x="48" y="259" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">An adverb of place answers WHERE, e.g. He lives abroad.</text><circle cx="32" cy="286" r="6" fill="#2563eb"/><text x="48" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">An adverb of time answers WHEN, e.g. They arrived early.</text><circle cx="32" cy="319" r="6" fill="#2563eb"/><text x="48" y="325" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">An adverb of frequency answers HOW OFTEN, e.g. He always comes first.</text><circle cx="32" cy="352" r="6" fill="#2563eb"/><text x="48" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">An adverb of degree answers HOW MUCH, e.g. It is extremely cold.</text><circle cx="32" cy="385" r="6" fill="#2563eb"/><text x="48" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Most adverbs are formed by adding -ly to an adjective: quick -&gt; quickly,</text><text x="48" y="412" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">careful -&gt; carefully.</text></svg>