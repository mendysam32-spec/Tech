<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Pronouns</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 7 • Topic 2</text><rect x="24" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Pronoun</text><rect x="202" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Personal pronoun</text><rect x="380" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Possessive adjecti…</text><rect x="558" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="643" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Possessive pronoun</text><rect x="24" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Reflexive pronoun</text><rect x="202" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Relative pronoun</text><rect x="380" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Demonstrative pron…</text><rect x="558" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="643" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Indefinite pronoun</text><line x1="24" y1="204" x2="736" y2="204" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="220" r="6" fill="#2563eb"/><text x="48" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A personal pronoun stands for a person or thing, e.g. I, you, he, she, it, we,</text><text x="48" y="247" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">they.</text><circle cx="32" cy="274" r="6" fill="#2563eb"/><text x="48" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A possessive pronoun shows ownership, e.g. mine, yours, his, hers, ours,</text><text x="48" y="301" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">theirs.</text><circle cx="32" cy="328" r="6" fill="#2563eb"/><text x="48" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A reflexive pronoun ends in -self or -selves, e.g. myself, yourself, himself,</text><text x="48" y="355" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">herself, itself, ourselves, themselves.</text><circle cx="32" cy="382" r="6" fill="#2563eb"/><text x="48" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A relative pronoun introduces a relative clause, e.g. who, whom, whose, which,</text><text x="48" y="409" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">that.</text><circle cx="32" cy="436" r="6" fill="#2563eb"/><text x="48" y="442" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A demonstrative pronoun points to a person or thing, e.g. this, that, these,</text><text x="48" y="463" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">those.</text><circle cx="32" cy="490" r="6" fill="#2563eb"/><text x="48" y="496" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">An indefinite pronoun does not refer to one particular person, e.g. somebody,</text><text x="48" y="517" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">anybody, everybody, nobody, none, all, some, many, few.</text></svg>