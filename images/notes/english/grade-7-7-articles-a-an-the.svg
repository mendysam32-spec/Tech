<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Articles: A, An, The</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 7 • Topic 7</text><rect x="24" y="92" width="216" height="120" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="132" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#1e3a8a">a</text>
<text x="132" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#334155">before a CONSONANT SOUND</text><text x="132" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">a book • a university • a</text><text x="132" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">European</text><rect x="264" y="92" width="216" height="120" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="372" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#1e3a8a">an</text>
<text x="372" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#334155">before a VOWEL SOUND</text><text x="372" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">an apple • an hour • an honest</text><text x="372" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">man</text><rect x="504" y="92" width="216" height="120" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="612" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#047857">the</text>
<text x="612" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#334155">when we BOTH KNOW which one</text><text x="612" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">the sun • the best • the</text><text x="612" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Gambia</text><rect x="24" y="240" width="712" height="96" rx="14" fill="#fffbeb" stroke="#fde68a"/>
<text x="40" y="266" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#78350f">NO ARTICLE</text>
<text x="40" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#92400e">general plural nouns (dogs are loyal) • uncountable nouns (water is life)</text>
<text x="40" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#92400e">school subjects (Mathematics) • games (football) • most meals (breakfast)</text><text x="30" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b91c1c">✗ a university → ✓ a university  (it begins with a 'y' sound)</text>
<text x="30" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b91c1c">✗ a hour → ✓ an hour  (the h is silent)</text></svg>