<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img"><rect width="760" height="560" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient></defs>
<path d="M0 22 A22 22 0 0 1 22 0 L738 0 A22 22 0 0 1 760 22 L760 58 L0 58 Z" fill="url(#band)"/>
<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Sentence Structure</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 8 • Topic 9</text><rect x="24" y="92" width="344" height="120" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="42" y="124" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1e3a8a">Simple</text>
<text x="42" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">one subject + one verb</text><text x="42" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">The boy kicked the ball.</text><rect x="396" y="92" width="344" height="120" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="414" y="124" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1e3a8a">Compound</text>
<text x="414" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">two main clauses + and / but</text><text x="414" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">The boy kicked the ball, and the girl cheered.</text><rect x="24" y="232" width="344" height="120" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="42" y="264" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1e3a8a">Complex</text>
<text x="42" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">main clause + because / although</text><text x="42" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Although the boy kicked the ball, the girl</text><text x="42" y="329" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">cheered.</text><rect x="396" y="232" width="344" height="120" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="414" y="264" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1e3a8a">Compound-complex</text>
<text x="414" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">two main clauses + a sub-clause</text><text x="414" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Although the boy kicked the ball, the girl</text><text x="414" y="329" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">cheered, and they laughed.</text><rect x="24" y="388" width="712" height="76" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="40" y="414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#047857">PHRASE vs CLAUSE</text>
<text x="40" y="438" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#065f46">A phrase has no subject-verb pair (the tall boy in the blue shirt); a clause has both.</text></svg>