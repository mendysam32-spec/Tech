<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img"><rect width="760" height="560" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient></defs>
<path d="M0 22 A22 22 0 0 1 22 0 L738 0 A22 22 0 0 1 760 22 L760 58 L0 58 Z" fill="url(#band)"/>
<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Informal Letter Writing — Perfect Letter Master…</text><rect x="230" y="86" width="300" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="460" y="104" width="160" height="24" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="472" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#334155">Your address (right)</text><rect x="460" y="136" width="160" height="24" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="472" y="153" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#334155">Date: 12th October 2026</text><rect x="250" y="176" width="190" height="24" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="262" y="193" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Dear Kofi,</text><rect x="250" y="212" width="260" height="24" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="262" y="229" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#334155">P1 - why you are writing</text><rect x="250" y="244" width="260" height="24" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="262" y="261" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#334155">P2 - the news / detail</text><rect x="250" y="276" width="260" height="24" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="262" y="293" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#334155">P3 - an example</text><rect x="250" y="308" width="260" height="24" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="262" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#334155">P4 - feelings / plans</text><rect x="250" y="348" width="230" height="24" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="262" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#047857">Closing: Love, Kofi</text><text x="380" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Your name (right, under the closing)</text><rect x="24" y="470" width="170" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="36" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">1. LAYOUT</text><text x="36" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">address + date right,</text><text x="36" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">salutation left</text><rect x="208" y="470" width="170" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="220" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">2. OPEN</text><text x="220" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">warm greeting + reason in</text><text x="220" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">sentence 1</text><rect x="392" y="470" width="170" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="404" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">3. BODY</text><text x="404" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">short paragraphs: news,</text><text x="404" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">thanks, plans</text><rect x="576" y="470" width="170" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="588" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">4. CLOSE</text><text x="588" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">wish + invitation to reply</text><text x="588" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#334155">+ sign-off</text></svg>