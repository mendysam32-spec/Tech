<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img"><rect width="760" height="560" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient></defs>
<path d="M0 22 A22 22 0 0 1 22 0 L738 0 A22 22 0 0 1 760 22 L760 58 L0 58 Z" fill="url(#band)"/>
<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Lexis: Synonyms and Antonyms</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 8 • Topic 12</text><rect x="24" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Synonym</text><rect x="202" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Antonym</text><rect x="380" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Gradable antonym</text><rect x="558" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="643" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Complementary anto…</text><rect x="24" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Converses</text><rect x="202" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Word family</text><rect x="380" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Register</text><line x1="24" y1="204" x2="736" y2="204" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="220" r="6" fill="#2563eb"/><text x="48" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Synonym: a word with the same meaning, e.g. happy - glad, cheerful.</text><circle cx="32" cy="253" r="6" fill="#2563eb"/><text x="48" y="259" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Antonym: a word with the opposite meaning, e.g. hot - cold, big - small.</text><circle cx="32" cy="286" r="6" fill="#2563eb"/><text x="48" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Gradable antonyms: opposite ends of a scale (old/young, tall/short, good/bad).</text><circle cx="32" cy="319" r="6" fill="#2563eb"/><text x="48" y="325" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Complementary antonyms: exact opposites with nothing in between (alive/dead,</text><text x="48" y="346" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">present/absent).</text><circle cx="32" cy="373" r="6" fill="#2563eb"/><text x="48" y="379" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Converses: one reverses the other (buy/sell, lend/borrow, give/take).</text><circle cx="32" cy="406" r="6" fill="#2563eb"/><text x="48" y="412" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Relational antonyms: words that are opposite in relation</text><text x="48" y="433" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">(ancestor/descendant).</text></svg>