<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img"><rect width="760" height="560" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient></defs>
<path d="M0 22 A22 22 0 0 1 22 0 L738 0 A22 22 0 0 1 760 22 L760 58 L0 58 Z" fill="url(#band)"/>
<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Nouns</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 7 • Topic 1</text><rect x="24" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Noun</text><rect x="202" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Common noun</text><rect x="380" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Proper noun</text><rect x="558" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="643" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Abstract noun</text><rect x="24" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Collective noun</text><rect x="202" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Concrete noun</text><rect x="380" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Countable noun</text><rect x="558" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="643" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Uncountable noun</text><line x1="24" y1="204" x2="736" y2="204" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="220" r="6" fill="#2563eb"/><text x="48" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A common noun names a general person, place or thing, e.g. boy, city, table.</text><circle cx="32" cy="253" r="6" fill="#2563eb"/><text x="48" y="259" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A proper noun names a specific person, place or thing and always begins with a</text><text x="48" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">capital letter, e.g. Kofi, Accra, Ghana, Monday.</text><circle cx="32" cy="307" r="6" fill="#2563eb"/><text x="48" y="313" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">An abstract noun names an idea, quality or state that cannot be seen or</text><text x="48" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">touched, e.g. happiness, honesty, freedom, bravery.</text><circle cx="32" cy="361" r="6" fill="#2563eb"/><text x="48" y="367" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A collective noun names a group of people, animals or things, e.g. a team, a</text><text x="48" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">flock, a crowd, a bundle.</text><circle cx="32" cy="415" r="6" fill="#2563eb"/><text x="48" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A concrete noun names something you can see or touch, e.g. chair, water, tree,</text><text x="48" y="442" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">bottle.</text><circle cx="32" cy="469" r="6" fill="#2563eb"/><text x="48" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">A countable noun can be counted with numbers, e.g. one book, two books, three</text><text x="48" y="496" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">pencils.</text></svg>