<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img"><rect width="760" height="560" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient></defs>
<path d="M0 22 A22 22 0 0 1 22 0 L738 0 A22 22 0 0 1 760 22 L760 58 L0 58 Z" fill="url(#band)"/>
<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Concord / Subject-Verb Agreement</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 7 • Topic 8</text><rect x="24" y="92" width="168" height="92" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="108" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">1. FIND THE SUBJECT</text><text x="108" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">The noun or pronoun</text><text x="108" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">BEFORE the verb</text><text x="199" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#2563eb">→</text><rect x="206" y="92" width="168" height="92" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="290" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">2. IGNORE DECOYS</text><text x="290" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">together with • as well</text><text x="290" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">as • of • along with</text><text x="381" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#2563eb">→</text><rect x="388" y="92" width="168" height="92" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="472" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">3. ONE OR MANY?</text><text x="472" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">each / every / either /</text><text x="472" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">neither → singular</text><text x="563" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#2563eb">→</text><rect x="570" y="92" width="168" height="92" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="654" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">4. MATCH THE VERB</text><text x="654" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">is / has / goes ↔ are /</text><text x="654" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">have / go</text><text x="30" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b91c1c">✗ The box of chocolates are heavy</text>
<text x="330" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#15803d">✓ The box of chocolates is heavy</text>
<text x="30" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">The real subject is 'box' (singular).</text><text x="30" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b91c1c">✗ The students was present</text>
<text x="330" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#15803d">✓ The students were present</text>
<text x="30" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">'Students' is plural, so the verb is plural.</text><text x="30" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b91c1c">✗ Neither the boys are present</text>
<text x="330" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#15803d">✓ Neither of the boys is present</text>
<text x="30" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">neither + of → singular verb.</text><text x="30" y="324" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b91c1c">✗ The news are good</text>
<text x="330" y="324" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#15803d">✓ The news is good</text>
<text x="30" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">news, mathematics, physics are singular.</text></svg>