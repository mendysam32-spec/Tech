<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img"><rect width="760" height="560" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient></defs>
<path d="M0 22 A22 22 0 0 1 22 0 L738 0 A22 22 0 0 1 760 22 L760 58 L0 58 Z" fill="url(#band)"/>
<text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#ffffff">Active and Passive Voice</text><text x="736" y="37" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">Grade 8 • Topic 11</text><rect x="24" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Active voice</text><rect x="202" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Passive voice</text><rect x="380" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Past participle</text><rect x="558" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="643" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Agent</text><line x1="24" y1="148" x2="736" y2="148" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="164" r="6" fill="#2563eb"/><text x="48" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Active: the subject performs the action - 'The chef cooked the meal.'</text><circle cx="32" cy="197" r="6" fill="#2563eb"/><text x="48" y="203" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Passive: the subject receives the action - 'The meal was cooked by the chef.'</text><circle cx="32" cy="230" r="6" fill="#2563eb"/><text x="48" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Structure: be + past participle (+ by + agent).</text><circle cx="32" cy="263" r="6" fill="#2563eb"/><text x="48" y="269" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">In the passive, the object of the active sentence becomes the subject of the</text><text x="48" y="290" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">passive sentence.</text><circle cx="32" cy="317" r="6" fill="#2563eb"/><text x="48" y="323" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">The doer of the action may be left out when it is unknown, obvious or</text><text x="48" y="344" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">unimportant: 'The window was broken.'</text><circle cx="32" cy="371" r="6" fill="#2563eb"/><text x="48" y="377" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Only transitive verbs (verbs that take an object) can be made passive.</text></svg>