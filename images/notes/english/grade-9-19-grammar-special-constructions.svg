<text x="287" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Inversion</text><rect x="380" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="465" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Emphatic form</text><rect x="558" y="82" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
