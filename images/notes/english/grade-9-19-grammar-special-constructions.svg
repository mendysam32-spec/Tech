<text x="109" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Defining relative…</text><rect x="202" y="138" width="170" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Non-defining relat…</text><line x1="24" y1="204" x2="736" y2="204" stroke="#e2e8f0" stroke-width="2"/><circle cx="32" cy="220" r="6" fill="#2563eb"/><text x="48" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Cleft sentence with it: 'It was Kofi who broke the window.'</text><circle cx="32" cy="253" r="6" fill="#2563eb"/><text x="48" y="259" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Cleft with there: 'There was a boy who called yesterday.'</text><circle cx="32" cy="286" r="6" fill="#2563eb"/><text x="48" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Cleft with what: 'What I need is more time.'</text><circle cx="32" cy="319" r="6" fill="#2563eb"/><text x="48" y="325" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Cleft sentences are used to focus on one element of the sentence.</text><circle cx="32" cy="352" r="6" fill="#2563eb"/><text x="48" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Inversion after a negative adverbial: 'Never have I seen such a scene.' / 'Not</text><text x="48" y="379" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">only did he apologise, but he also paid.'</text><circle cx="32" cy="406" r="6" fill="#2563eb"/><text x="48" y="412" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Inversion after 'so/such': 'So cold was the water that the fish died.'</text></svg>