<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
</defs>
<text x="420" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Avoiding Parallax Error — reading the meniscus</text>
<rect x="430" y="80" width="150" height="280" rx="10" fill="#e0f2fe" stroke="#0e7490" stroke-width="3"/>
<path d="M446 290 Q480 268 514 258 Q530 264 548 272 L548 344 Q530 340 514 342 Q470 346 446 356 Z" fill="#7dd3fc"/>
<path d="M430 258 Q505 232 580 258 V358 H430 Z" fill="#bae6fd" opacity="0.0"/>
<path d="M448 258 Q505 240 566 258" fill="none" stroke="#0369a1" stroke-width="2.5"/>
<g font-size="11" fill="#334155">
  <line x1="430" y1="110" x2="418" y2="110" stroke="#475569"/><text x="392" y="114">10</text>
  <line x1="430" y1="160" x2="418" y2="160" stroke="#475569"/><text x="392" y="164">20</text>
  <line x1="430" y1="210" x2="418" y2="210" stroke="#475569"/><text x="392" y="214">30</text>
  <line x1="430" y1="258" x2="412" y2="258" stroke="#0f172a" stroke-width="2"/><text x="380" y="262" font-weight="700">38</text>
  <line x1="430" y1="308" x2="418" y2="308" stroke="#475569"/><text x="392" y="312">40</text>
</g>
<text x="505" y="385" text-anchor="middle" font-size="12" fill="#0e7490">measuring cylinder</text>
<!-- wrong eye -->
<circle cx="150" cy="350" r="30" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<circle cx="150" cy="350" r="7" fill="#dc2626"/>
<path d="M178 330 L438 262" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="150" y="405" text-anchor="middle" font-size="13.5" font-weight="700" fill="#dc2626">WRONG</text>
<text x="150" y="424" text-anchor="middle" font-size="11.5" fill="#7f1d1d">eye at an angle →</text>
<text x="150" y="439" text-anchor="middle" font-size="11.5" fill="#7f1d1d">reading looks smaller</text>
<!-- correct eye -->
<circle cx="660" cy="258" r="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<circle cx="660" cy="258" r="7" fill="#16a34a"/>
<path d="M632 258 L586 258" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="660" y="190" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16a34a">CORRECT</text>
<text x="660" y="208" text-anchor="middle" font-size="11.5" fill="#14532d">eye level with the</text>
<text x="660" y="223" text-anchor="middle" font-size="11.5" fill="#14532d">bottom of the meniscus</text>
<path d="M430 258 Q505 240 580 258" fill="none" stroke="#0369a1" stroke-width="2.5"/>
<text x="505" y="250" text-anchor="middle" font-size="11" fill="#0369a1">meniscus</text>
</svg>