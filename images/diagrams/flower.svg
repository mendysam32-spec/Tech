<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<text x="440" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Parts of a Flower (cross-section)</text>
<rect x="390" y="480" width="40" height="70" rx="8" fill="#16a34a"/>
<ellipse cx="410" cy="470" rx="90" ry="22" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
<path d="M410 455 Q200 300 260 180 Q350 260 410 430" fill="#fda4af" stroke="#db2777" stroke-width="2.5"/>
<path d="M410 455 Q620 300 560 180 Q470 260 410 430" fill="#fda4af" stroke="#db2777" stroke-width="2.5"/>
<path d="M300 470 Q120 440 130 520 Q260 560 390 500" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
<path d="M520 470 Q700 440 690 520 Q560 560 430 500" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
<ellipse cx="410" cy="330" rx="70" ry="55" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
<line x1="410" y1="275" x2="410" y2="228" stroke="#ca8a04" stroke-width="7"/>
<ellipse cx="410" cy="220" rx="24" ry="14" fill="#ca8a04"/>
<line x1="330" y1="360" x2="330" y2="196" stroke="#ca8a04" stroke-width="5"/>
<path d="M330 196 L314 170 L330 178 L346 170 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
<path d="M330 196 L318 172 M330 196 L342 172" stroke="#b45309" stroke-width="2"/>
<ellipse cx="330" cy="172" rx="14" ry="8" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
<circle cx="390" cy="315" r="8" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/><circle cx="430" cy="312" r="8" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/><circle cx="398" cy="352" r="8" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/><circle cx="424" cy="350" r="8" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/><circle cx="380" cy="342" r="8" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/><circle cx="416" cy="330" r="8" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
<g font-size="12.5" fill="#334155">
<line x1="306" y1="548" x2="405" y2="490" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="405" cy="490" r="3.2" fill="#16a34a"/>
  <text x="300" y="545">Receptacle — holds all the flower parts</text>
  <line x1="66" y1="475" x2="120" y2="505" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="120" cy="505" r="3.2" fill="#16a34a"/>
  <text x="60" y="472">Sepals — protect the bud before it opens</text>
  <line x1="66" y1="213" x2="170" y2="235" stroke="#db2777" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="170" cy="235" r="3.2" fill="#db2777"/>
  <text x="60" y="210">Petals — bright to attract insects</text>
  <line x1="358" y1="143" x2="330" y2="172" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="330" cy="172" r="3.2" fill="#b45309"/>
  <text x="352" y="140">Anther — makes pollen (stamen = male part)</text>
  <line x1="76" y1="303" x2="330" y2="268" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="330" cy="268" r="3.2" fill="#b45309"/>
  <text x="70" y="300">Filament — stalk that lifts the anther</text>
  <line x1="430" y1="199" x2="408" y2="214" stroke="#ca8a04" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="408" cy="214" r="3.2" fill="#ca8a04"/>
  <text x="424" y="196">Stigma — receives pollen (carpel = female part)</text>
  <line x1="430" y1="259" x2="410" y2="252" stroke="#ca8a04" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="410" cy="252" r="3.2" fill="#ca8a04"/>
  <text x="424" y="256">Style — tube from stigma down to the ovary</text>
  <line x1="336" y1="423" x2="398" y2="356" stroke="#ca8a04" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="398" cy="356" r="3.2" fill="#ca8a04"/>
  <text x="330" y="420">Ovary — holds the ovules</text>
  <line x1="706" y1="303" x2="424" y2="350" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="424" cy="350" r="3.2" fill="#b45309"/>
  <text x="700" y="300">Ovules — become seeds after fertilisation</text>
</g>
<text x="440" y="566" text-anchor="middle" font-size="12.5" fill="#475569">Pollination transfers pollen from anther to stigma; after fertilisation the ovules ripen into seeds.</text>
</svg>
