<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Structure of the Human Ear</text>
<path d="M60 210 C 40 140 20 150 18 240 C 17 320 40 350 92 330 C 66 308 62 268 60 210 Z" fill="#fcd9b8" stroke="#b45309" stroke-width="3"/>
<path d="M88 240 Q 150 248 228 238" stroke="#b45309" stroke-width="26" stroke-linecap="round" fill="none"/>
<path d="M98 236 Q 150 246 224 234" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none"/>
<line x1="240" y1="196" x2="240" y2="318" stroke="#7c2d12" stroke-width="6"/>
<ellipse cx="240" cy="257" rx="16" ry="64" fill="none" stroke="#9a3412" stroke-width="3"/>
<g>
  <rect x="268" y="228" width="22" height="30" rx="7" fill="#fcd9b8" stroke="#b45309" stroke-width="2"/>
  <line x1="278" y1="258" x2="240" y2="272" stroke="#b45309" stroke-width="2"/>
  <rect x="276" y="212" width="24" height="26" rx="7" fill="#fcd9b8" stroke="#b45309" stroke-width="2"/>
  <line x1="288" y1="212" x2="278" y2="246" stroke="#b45309" stroke-width="2"/>
  <path d="M306 236 q10 -14 22 -6 q-4 12 8 16" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
  <line x1="318" y1="236" x2="300" y2="262" stroke="#b45309" stroke-width="2"/>
</g>
<path d="M270 330 C 300 400 340 420 360 462" fill="none" stroke="#9a3412" stroke-width="10" stroke-linecap="round"/>
<path d="M270 330 C 300 400 340 420 360 462" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
<g>
  <path d="M360 150 a 24 24 0 1 1 48 0 a 24 24 0 1 1 -48 0" fill="none" stroke="#7c2d12" stroke-width="5"/>
  <path d="M380 128 a 20 20 0 1 1 40 0 a 20 20 0 1 1 -40 0" fill="none" stroke="#b45309" stroke-width="5"/>
  <path d="M410 162 a 20 20 0 1 1 40 0 a 20 20 0 1 1 -40 0" fill="none" stroke="#b45309" stroke-width="5"/>
</g>
<path d="M400 260 C 460 250 500 280 520 300 C 470 312 440 305 405 292 C 375 282 356 296 342 318 C 316 340 320 372 352 396 C 390 420 430 402 428 376 C 426 354 404 330 376 322 C 390 316 410 318 422 330" fill="none" stroke="#7c2d12" stroke-width="6"/>
<line x1="440" y1="300" x2="800" y2="285" stroke="#7c2d12" stroke-width="6"/>
<path d="M440 300 C 560 295 660 285 800 288" fill="none" stroke="#fbbf24" stroke-width="3"/>
<g font-size="12.5" fill="#334155">
<line x1="50" y1="123" x2="58" y2="215" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="58" cy="215" r="3.2" fill="#b45309"/>
  <text x="44" y="120">Pinna — collects and channels sound waves</text>
  <line x1="168" y1="247" x2="150" y2="240" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="150" cy="240" r="3.2" fill="#b45309"/>
  <text x="162" y="244">Ear canal — carries the waves to the eardrum</text>
  <line x1="260" y1="187" x2="240" y2="215" stroke="#7c2d12" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="240" cy="215" r="3.2" fill="#7c2d12"/>
  <text x="254" y="184">Eardrum (tympanum) — vibrates when sound hits it</text>
  <line x1="314" y1="197" x2="300" y2="232" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="300" cy="232" r="3.2" fill="#b45309"/>
  <text x="308" y="194">Ossicles (malleus, incus, stapes) — amplify the vibration</text>
  <line x1="364" y1="491" x2="345" y2="410" stroke="#9a3412" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="345" cy="410" r="3.2" fill="#9a3412"/>
  <text x="358" y="488">Eustachian tube — balances pressure behind the eardrum</text>
  <line x1="388" y1="121" x2="400" y2="150" stroke="#7c2d12" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="400" cy="150" r="3.2" fill="#7c2d12"/>
  <text x="382" y="118">Semicircular canals — help us balance</text>
  <line x1="426" y1="371" x2="410" y2="322" stroke="#7c2d12" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="410" cy="322" r="3.2" fill="#7c2d12"/>
  <text x="420" y="368">Cochlea — changes vibrations into nerve impulses</text>
  <line x1="478" y1="289" x2="520" y2="292" stroke="#7c2d12" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="520" cy="292" r="3.2" fill="#7c2d12"/>
  <text x="472" y="286">Auditory nerve — carries the signal to the brain</text>
</g>
<text x="450" y="528" text-anchor="middle" font-size="13" fill="#334155">Sound: pinna → ear canal → eardrum → ossicles → cochlea → auditory nerve → brain.</text>
</svg>
