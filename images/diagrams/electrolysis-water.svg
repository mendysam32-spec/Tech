<text x="430" y="500" text-anchor="middle" font-size="13" fill="#334155">Water splits into hydrogen and oxygen: 2H₂O → 2H₂ + O₂ (ratio 2 : 1 by volume).</text>
<text x="430" y="524" text-anchor="middle" font-size="12.5" fill="#475569">A little acid (e.g. dilute H₂SO₄ or NaOH) is added so the water conducts electricity.</text>
