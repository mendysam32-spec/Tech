<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Life Cycle of a Toad — metamorphosis</text>
<g>
  <text x="90" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">① Eggs</text>
  <circle cx="90" cy="180" r="26" fill="#86efac"/>
  <circle cx="70" cy="160" r="8" fill="#15803d" opacity=".85"/><circle cx="112" cy="172" r="8" fill="#15803d" opacity=".85"/><circle cx="88" cy="196" r="8" fill="#15803d" opacity=".85"/><circle cx="104" cy="152" r="8" fill="#15803d" opacity=".85"/><circle cx="72" cy="202" r="8" fill="#15803d" opacity=".85"/><circle cx="118" cy="196" r="8" fill="#15803d" opacity=".85"/>
  <text x="90" y="330" text-anchor="middle" font-size="12" fill="#475569">laid in water</text>
</g>
<g>
  <text x="300" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">② Tadpole</text>
  <circle cx="288" cy="200" r="26" fill="#4b5563"/>
  <path d="M300 196 q26 -4 44 8 q-14 8 -30 4 z" fill="#4b5563"/>
  <circle cx="280" cy="192" r="3" fill="#fff"/>
  <path d="M268 216 q-8 12 -20 12" fill="none" stroke="#3f3f46" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="330" text-anchor="middle" font-size="12" fill="#475569">breathes with gills, swims</text>
</g>
<g>
  <text x="510" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">③ Tadpole + legs</text>
  <circle cx="498" cy="200" r="26" fill="#6b7280"/>
  <path d="M510 196 q26 -4 44 8 q-14 8 -30 4 z" fill="#6b7280"/>
  <path d="M478 216 q-10 16 -24 20 q-2 -8 10 -16" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <path d="M498 224 q-2 16 4 24" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <path d="M512 222 q4 14 16 18" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <text x="510" y="330" text-anchor="middle" font-size="12" fill="#475569">hind legs grow</text>
</g>
<g>
  <text x="720" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">④ Adult toad</text>
  <ellipse cx="720" cy="208" rx="40" ry="26" fill="#065f46"/>
  <circle cx="684" cy="186" r="18" fill="#065f46"/>
  <circle cx="674" cy="180" r="4" fill="#fff"/>
  <ellipse cx="740" cy="228" rx="20" ry="8" fill="#047857" transform="rotate(-18 740 228)"/>
  <path d="M668 200 q-20 12 -30 26 q10 -4 24 4" fill="none" stroke="#064e3b" stroke-width="5" stroke-linecap="round"/>
  <path d="M706 232 q-6 22 2 30 M736 232 q6 22 -2 30" fill="none" stroke="#064e3b" stroke-width="5" stroke-linecap="round"/>
  <text x="720" y="330" text-anchor="middle" font-size="12" fill="#475569">breathes with lungs on land</text>
</g>
<path d="M145 200 L205 200" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/>
<path d="M355 200 L415 200" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/>
<path d="M565 200 L625 200" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/>
<text x="450" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">LIVES IN WATER → MOVES ONTO LAND</text>
<text x="450" y="292" text-anchor="middle" font-size="12.5" fill="#475569">Toad skin stays moist for breathing through the skin; the whole cycle is called metamorphosis.</text>
<text x="450" y="368" text-anchor="middle" font-size="12.5" fill="#64748b">Only the tadpole lives entirely in water; the adult toad breathes air and returns to water only to breed.</text>
</svg>