<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
</defs>
<text x="410" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Distance-Time Graph</text>
<line x1="120" y1="440" x2="740" y2="440" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
<line x1="120" y1="440" x2="120" y2="80" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
<text x="740" y="468" text-anchor="middle" font-size="14" fill="#334155">Time (s)</text>
<text x="66" y="90" font-size="14" fill="#334155">Distance (m)</text>
<g font-size="11.5" fill="#64748b">
  <text x="108" y="445">0</text>
  <text x="206" y="445">10</text><line x1="140" y1="440" x2="140" y2="434" stroke="#cbd5e1"/>
  <text x="290" y="445">20</text><line x1="240" y1="440" x2="240" y2="434" stroke="#cbd5e1"/>
  <text x="374" y="445">30</text><line x1="340" y1="440" x2="340" y2="434" stroke="#cbd5e1"/>
  <text x="458" y="445">40</text><line x1="440" y1="440" x2="440" y2="434" stroke="#cbd5e1"/>
  <text x="98" y="230">40</text><line x1="120" y1="240" x2="126" y2="240" stroke="#cbd5e1"/>
  <text x="98" y="130">80</text><line x1="120" y1="140" x2="126" y2="140" stroke="#cbd5e1"/>
</g>
<line x1="140" y1="300" x2="700" y2="300" stroke="#dc2626" stroke-width="3.5"/>
<text x="722" y="294" font-size="13" fill="#dc2626">A → B</text>
<line x1="140" y1="430" x2="380" y2="300" stroke="#2563eb" stroke-width="3.5"/>
<text x="390" y="330" font-size="13" fill="#2563eb">B → C</text>
<path d="M380 300 C 520 296 560 150 700 90" fill="none" stroke="#16a34a" stroke-width="3.5"/>
<text x="700" y="82" font-size="13" fill="#16a34a">C → D</text>
<g font-size="13.5" fill="#334155">
  <rect x="130" y="90" width="22" height="6" rx="3" fill="#dc2626"/><text x="160" y="98">flat = stationary (not moving)</text>
  <rect x="130" y="112" width="22" height="6" rx="3" fill="#2563eb"/><text x="160" y="120">straight sloping line = constant speed</text>
  <rect x="130" y="134" width="22" height="6" rx="3" fill="#16a34a"/><text x="160" y="142">curving upward = accelerating (faster)</text>
</g>
<text x="410" y="500" text-anchor="middle" font-size="13" fill="#475569">The steeper the line, the greater the speed.</text>
</svg>