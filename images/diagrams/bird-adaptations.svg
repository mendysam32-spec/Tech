</defs>
<text x="440" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Adaptations of Birds for Flight</text>
<ellipse cx="440" cy="250" rx="120" ry="70" fill="#fbcfe8" stroke="#db2777" stroke-width="3"/>
<circle cx="330" cy="190" r="42" fill="#fbcfe8" stroke="#db2777" stroke-width="3"/>
<path d="M292 176 L238 188 L294 196 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="2.5"/>
<circle cx="318" cy="180" r="6" fill="#9f1239"/>
<path d="M440 230 Q540 170 600 200 Q550 260 470 260 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="3"/>
<path d="M500 300 Q590 330 640 300 q20 30 0 58 q-50 30 -130 6" fill="#f9a8d4" stroke="#db2777" stroke-width="3"/>
