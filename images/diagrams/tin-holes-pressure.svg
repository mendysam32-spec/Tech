<path d="M24 260 L4 258 L10 248 M24 260 L4 262 L10 272" fill="none" stroke="#0284c7" stroke-width="4"/><path d="M46 340 L26 338 L32 328 M46 340 L26 342 L32 352" fill="none" stroke="#0284c7" stroke-width="4"/>
<path d="M310 250 L200 248 L214 240 M310 250 L200 252 L214 260" fill="none" stroke="#0284c7" stroke-width="4"/><path d="M310 330 L200 328 L214 320 M310 330 L200 332 L214 340" fill="none" stroke="#0284c7" stroke-width="4"/>
<text x="420" y="120" text-anchor="middle" font-size="13.5" fill="#0369a1">a tin with holes in its sides is pushed into the water</text>
<text x="68" y="420" font-size="13" fill="#0c4a6e">water squirting in through</text>
<text x="68" y="438" font-size="13" fill="#0c4a6e">every hole — top, side and bottom</text>
<text x="420" y="486" text-anchor="middle" font-size="13.5" fill="#334155">Liquid pressure increases with depth and always acts at right angles to the surface.</text>
