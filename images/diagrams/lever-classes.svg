<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
</defs>
<text x="440" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Classes of Levers — where the fulcrum sits</text>

<g>
  <text x="70" y="98" font-size="15.5" font-weight="700" fill="#0f172a">1st class</text>
  <text x="380" y="98" font-size="12.5" fill="#475569">Fulcrum between Effort and Load — e.g. seesaw, scissors, pliers</text>
  <rect x="60" y="120" width="560" height="18" rx="9" fill="#475569"/>
  <path d="M60 148 L86 198 L34 198 Z" fill="#dc2626"/>
  <text x="60" y="216" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">FULCRUM (pivot)</text>
  <path d="M376 114 L340 114 L352 100 M340 114 L352 128" stroke="#16a34a" stroke-width="5" fill="none"/>
  <text x="340" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">LOAD</text>
  <path d="M616 162 L580 162 L592 148 M580 162 L592 176" stroke="#2563eb" stroke-width="5" fill="none"/>
  <text x="580" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">EFFORT</text>
</g>
<g>
  <text x="70" y="308" font-size="15.5" font-weight="700" fill="#0f172a">2nd class</text>
  <text x="380" y="308" font-size="12.5" fill="#475569">Load between Effort and Fulcrum — e.g. wheelbarrow, bottle opener</text>
  <rect x="60" y="330" width="560" height="18" rx="9" fill="#475569"/>
  <path d="M60 358 L86 408 L34 408 Z" fill="#dc2626"/>
  <text x="60" y="426" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">FULCRUM (pivot)</text>
  <path d="M336 324 L300 324 L312 310 M300 324 L312 338" stroke="#16a34a" stroke-width="5" fill="none"/>
  <text x="300" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">LOAD</text>
  <path d="M616 372 L580 372 L592 358 M580 372 L592 386" stroke="#2563eb" stroke-width="5" fill="none"/>
  <text x="580" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">EFFORT</text>
</g>
<g>
  <text x="70" y="518" font-size="15.5" font-weight="700" fill="#0f172a">3rd class</text>
  <text x="380" y="518" font-size="12.5" fill="#475569">Effort between Load and Fulcrum — e.g. tweezers, fishing rod, forearm</text>
  <rect x="60" y="540" width="560" height="18" rx="9" fill="#475569"/>
  <path d="M60 568 L86 618 L34 618 Z" fill="#dc2626"/>
  <text x="60" y="636" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">FULCRUM (pivot)</text>
  <path d="M336 534 L300 534 L312 520 M300 534 L312 548" stroke="#16a34a" stroke-width="5" fill="none"/>
  <text x="300" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">LOAD</text>
  <path d="M96 582 L60 582 L72 568 M60 582 L72 596" stroke="#2563eb" stroke-width="5" fill="none"/>
  <text x="60" y="618" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">EFFORT</text>
</g>
<text x="440" y="636" text-anchor="middle" font-size="13" fill="#334155">Moment = Force × perpendicular distance from the pivot. A larger effort arm needs a smaller effort.</text>
</svg>