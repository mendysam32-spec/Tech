<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The Plant Kingdom</text>
<rect x="330" y="70" width="240" height="46" rx="12" fill="#16a34a" stroke="#166534" stroke-width="2"/>
<text x="450" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PLANT</text>
<text x="450" y="116" text-anchor="middle" font-size="12.5" fill="#dcfce7">made their own food (photosynthesis)</text>
<line x1="330" y1="116" x2="230" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="570" y1="116" x2="670" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="120" y="160" width="220" height="46" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="230" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Flowering</text>
<text x="230" y="196" text-anchor="middle" font-size="12" fill="#166534">(seeds in fruits / cones)</text>
<rect x="560" y="160" width="220" height="46" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="670" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Non-flowering</text>
<text x="670" y="196" text-anchor="middle" font-size="12" fill="#991b1b">(spores, no flowers)</text>
<line x1="230" y1="206" x2="230" y2="250" stroke="#64748b" stroke-width="2"/>
<line x1="230" y1="250" x2="120" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="230" y1="250" x2="340" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="670" y1="206" x2="670" y2="250" stroke="#64748b" stroke-width="2"/>
<line x1="670" y1="250" x2="560" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="670" y1="250" x2="780" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="292" width="160" height="60" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="120" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Angiosperms</text>
<text x="120" y="333" text-anchor="middle" font-size="11.5" fill="#1e40af">flowering plants,</text>
<text x="120" y="347" text-anchor="middle" font-size="11.5" fill="#1e40af">seeds in fruits</text>
<rect x="260" y="292" width="160" height="60" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="340" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Gymnosperms</text>
<text x="340" y="333" text-anchor="middle" font-size="11.5" fill="#1e40af">naked seeds,</text>
<text x="340" y="347" text-anchor="middle" font-size="11.5" fill="#1e40af">one example: the vine</text>
<rect x="480" y="292" width="160" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="560" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">Ferns</text>
<text x="560" y="333" text-anchor="middle" font-size="11.5" fill="#92400e">reproduce with</text>
<text x="560" y="347" text-anchor="middle" font-size="11.5" fill="#92400e">spores underground</text>
<rect x="700" y="292" width="160" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="780" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">Mosses</text>
<text x="780" y="333" text-anchor="middle" font-size="11.5" fill="#991b1b">green, damp,</text>
<text x="780" y="347" text-anchor="middle" font-size="11.5" fill="#991b1b">no true water tubes</text>
<text x="450" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Examples found in Ghana</text>
<text x="450" y="446" text-anchor="middle" font-size="12.5" fill="#334155">• Coconut palm — flowering; its fruit holds a single big seed</text><text x="450" y="470" text-anchor="middle" font-size="12.5" fill="#334155">• Maize (corn) — flowering; grain seeds packed on a cob</text><text x="450" y="494" text-anchor="middle" font-size="12.5" fill="#334155">• Pine — a Gymnosperm; cones carry naked seeds</text><text x="450" y="518" text-anchor="middle" font-size="12.5" fill="#334155">• Fern and moss — reproduce by spores, not by seeds</text>
<text x="450" y="566" text-anchor="middle" font-size="12.5" fill="#475569">Naming the two big groups: flowering plants bear flowers; non-flowering plants (ferns, mosses) do not.</text>
</svg>