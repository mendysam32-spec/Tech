<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<text x="460" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Simple Machines</text>
<g>
  <text x="230" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Pulley</text>
  <circle cx="230" cy="180" r="44" fill="#e0f2fe" stroke="#0e7490" stroke-width="4"/>
  <circle cx="230" cy="180" r="14" fill="#94a3b8"/>
  <path d="M196 150 L196 320" stroke="#475569" stroke-width="6"/>
  <path d="M264 150 L264 320" stroke="#475569" stroke-width="6"/>
  <rect x="180" y="320" width="32" height="60" fill="#94a3b8"/>
  <path d="M264 250 L330 250" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
  <text x="300" y="240" fill="#1d4ed8" font-size="12.5" font-weight="700">effort</text>
  <text x="230" y="430" text-anchor="middle" font-size="12.5" fill="#475569">changing the pull direction makes lifting easier</text>
</g>
<g>
  <text x="690" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Inclined plane</text>
  <path d="M540 360 L840 360 L540 160 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="640" y="232" width="64" height="44" fill="#fca5a5" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M700 300 L700 236" stroke="#475569" stroke-width="3"/>
  <path d="M560 340 L820 340" stroke="#94a3b8" stroke-width="4"/>
  <path d="M620 205 L740 300" stroke="#16a34a" stroke-width="5" marker-end="url(#a)"/>
  <text x="620" y="200" fill="#166534" font-size="12.5" font-weight="700">small effort rolls</text>
  <text x="620" y="190" fill="#166534" font-size="12.5" font-weight="700">a heavy barrel up</text>
  <text x="690" y="420" text-anchor="middle" font-size="12.5" fill="#475569">slope spreads the work over a longer distance</text>
</g>
<g>
  <text x="230" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Wedge</text>
  <text x="230" y="260" text-anchor="middle" font-size="12" fill="#64748b">&amp; wheel &amp; axle</text>
  <circle cx="160" cy="360" r="40" fill="#e0f2fe" stroke="#0e7490" stroke-width="4"/>
  <circle cx="160" cy="360" r="14" fill="#94a3b8"/>
  <line x1="160" y1="320" x2="160" y2="400" stroke="#475569" stroke-width="5"/>
  <line x1="120" y1="360" x2="200" y2="360" stroke="#475569" stroke-width="5"/>
  <path d="M270 320 L270 400 L310 360 Z" fill="#fca5a5" stroke="#dc2626" stroke-width="3"/>
  <path d="M300 330 L300 420" stroke="#475569" stroke-width="3"/>
  <path d="M310 360 L370 360 L350 350 M310 360 L370 360 L350 370" stroke="#16a34a" stroke-width="5"/>
  <text x="300" y="440" fill="#475569" font-size="11.5">split or cut (axe, knife)</text>
  <text x="160" y="440" fill="#475569" font-size="11.5">axle + wheel (steering)</text>
</g>
<g>
  <text x="690" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Lever</text>
  <rect x="560" y="320" width="260" height="16" rx="8" fill="#475569"/>
  <path d="M690 336 L710 380 L670 380 Z" fill="#dc2626"/>
  <path d="M596 340 L560 340 L574 326 M596 340 L560 340 L574 354" stroke="#16a34a" stroke-width="5"/>
  <text x="560" y="318" fill="#166534" font-size="12.5" font-weight="700">LOAD</text>
  <path d="M780 356 L816 356 M780 356 L816 342 M780 356 L816 370" stroke="#2563eb" stroke-width="5"/>
  <text x="780" y="388" fill="#1d4ed8" font-size="12.5" font-weight="700">EFFORT</text>
  <text x="692" y="420" text-anchor="middle" font-size="12.5" fill="#475569">see-saw balance: clockwise moment = anticlockwise moment</text>
</g>
<text x="460" y="560" text-anchor="middle" font-size="13" fill="#334155">Simple machines multiply force or change its direction so that the same work is done with less effort.</text>
</svg>