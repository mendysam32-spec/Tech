<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<text x="410" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The Light Microscope — main parts</text>
<rect x="300" y="520" width="200" height="22" rx="6" fill="#64748b"/>
<rect x="330" y="470" width="18" height="70" fill="#475569"/>
<rect x="520" y="180" width="30" height="360" fill="#475569"/>
<rect x="420" y="330" width="180" height="16" rx="6" fill="#334155"/>
<rect x="400" y="346" width="220" height="10" rx="5" fill="#94a3b8"/>
<rect x="506" y="210" width="30" height="150" fill="#64748b"/>
<rect x="488" y="160" width="66" height="50" rx="8" fill="#475569"/>
<rect x="474" y="130" width="94" height="30" rx="8" fill="#334155"/>
<line x1="470" y1="212" x2="430" y2="212" stroke="#475569" stroke-width="14"/>
<line x1="470" y1="232" x2="445" y2="232" stroke="#475569" stroke-width="10"/>
<line x1="430" y1="212" x2="430" y2="352" stroke="#475569" stroke-width="8"/>
<line x1="445" y1="232" x2="445" y2="352" stroke="#475569" stroke-width="6"/>
<g font-size="12.5" fill="#334155">
<line x1="489" y1="117" x2="521" y2="122" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="521" cy="122" r="3.2" fill="#64748b"/>
  <text x="483" y="114">Eyepiece — you look through, magnifies</text>
  <line x1="425" y1="93" x2="521" y2="175" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="521" cy="175" r="3.2" fill="#64748b"/>
  <text x="419" y="90">Body tube — tube that holds the lenses</text>
  <line x1="535" y1="147" x2="521" y2="156" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="521" cy="156" r="3.2" fill="#64748b"/>
  <text x="529" y="144">Objective lenses — different powers of magnification</text>
  <line x1="445" y1="401" x2="450" y2="342" stroke="#334155" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="450" cy="342" r="3.2" fill="#334155"/>
  <text x="439" y="398">Stage — small platform; slide rests here</text>
  <line x1="405" y1="439" x2="430" y2="402" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="430" cy="402" r="3.2" fill="#64748b"/>
  <text x="399" y="436">Diaphragm — lets in the right amount of light</text>
  <line x1="345" y1="507" x2="400" y2="468" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="400" cy="468" r="3.2" fill="#64748b"/>
  <text x="339" y="504">Mirror / lamp — light source for the slide</text>
  <line x1="325" y1="543" x2="300" y2="530" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="300" cy="530" r="3.2" fill="#64748b"/>
  <text x="319" y="540">Base — heavy support; hold it when carrying</text>
  <line x1="635" y1="347" x2="600" y2="320" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="600" cy="320" r="3.2" fill="#64748b"/>
  <text x="629" y="344">Arm — curved part; grip it when carrying</text>
  <line x1="615" y1="257" x2="595" y2="238" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="595" cy="238" r="3.2" fill="#64748b"/>
  <text x="609" y="254">Coarse focus — big adjustments of sharpness</text>
  <line x1="615" y1="219" x2="595" y2="222" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="595" cy="222" r="3.2" fill="#64748b"/>
  <text x="609" y="216">Fine focus — small/tiny adjustments</text>
  <line x1="535" y1="359" x2="520" y2="350" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="520" cy="350" r="3.2" fill="#64748b"/>
  <text x="529" y="356">Stage clips — hold the slide in place</text>
</g>
<text x="410" y="562" text-anchor="middle" font-size="12.5" fill="#475569">Use low power first, then switch to high power. Carry with two hands.</text>
</svg>
