<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Some Internal Organs of the Human Body</text>
<circle cx="430" cy="110" r="56" fill="#fcd9b8" stroke="#b45309" stroke-width="3"/>
<path d="M430 160 L430 205" stroke="#b45309" stroke-width="12"/>
<path d="M360 200 Q 430 178 500 200 L510 205 L350 205 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<rect x="348" y="205" width="30" height="8" fill="#94a3b8"/>
<path d="M352 213 L470 213" stroke="#b45309" stroke-width="8"/>
<path d="M352 218 Q310 250 310 300 Q310 350 335 355" fill="#fca5a5" stroke="#b45309" stroke-width="3"/>
<path d="M470 222 Q510 250 515 300 Q515 350 490 355" fill="#fca5a5" stroke="#b45309" stroke-width="3"/>
<path d="M396 262 q30 -26 60 0 q22 20 4 46 q-34 30 -64 0 q-22 -22 -4 -46" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
<path d="M300 360 Q 430 345 560 360" fill="none" stroke="#7c2d12" stroke-width="7"/>
<path d="M440 372 Q 510 380 522 430 Q 480 452 440 432 Z" fill="#8b5cf6" stroke="#6d28d9" stroke-width="3"/>
<path d="M300 388 Q 268 420 288 442 Q 316 450 330 430 Z" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
<ellipse cx="402" cy="420" rx="26" ry="14" fill="#fbbf24" stroke="#b45309" stroke-width="2.5"/>
<ellipse cx="430" cy="452" rx="30" ry="15" fill="#fda4af" stroke="#db2777" stroke-width="2.5"/>
<ellipse cx="430" cy="480" rx="26" ry="12" fill="#fda4af" stroke="#db2777" stroke-width="2.5"/>
<g>
  <ellipse cx="408" cy="450" rx="8" ry="12" fill="#f87171" stroke="#b91c1c" stroke-width="2"/>
  <ellipse cx="452" cy="450" rx="8" ry="12" fill="#f87171" stroke="#b91c1c" stroke-width="2"/>
</g>
<path d="M355 205 a 10 10 0 1 1 20 0" fill="none" stroke="#334155" stroke-width="2"/>
<g font-size="12.5" fill="#334155">
<line x1="538" y1="253" x2="505" y2="300" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="505" cy="300" r="3.2" fill="#dc2626"/>
  <text x="532" y="250">Lungs — oxygen in, carbon dioxide out (exchange of gases)</text>
  <line x1="86" y1="239" x2="425" y2="288" stroke="#991b1b" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="425" cy="288" r="3.2" fill="#991b1b"/>
  <text x="80" y="236">Heart — pumps blood around the body</text>
  <line x1="566" y1="469" x2="478" y2="425" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="478" cy="425" r="3.2" fill="#6d28d9"/>
  <text x="560" y="466">Liver — makes bile, stores vitamins and glycogen, breaks down poisons</text>
  <line x1="66" y1="523" x2="282" y2="435" stroke="#c2410c" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="282" cy="435" r="3.2" fill="#c2410c"/>
  <text x="60" y="520">Kidneys — filter waste (urea and salts) from the blood to form urine</text>
  <line x1="566" y1="353" x2="408" y2="415" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="408" cy="415" r="3.2" fill="#b45309"/>
  <text x="560" y="350">Pancreas — makes insulin which controls blood sugar</text>
  <line x1="86" y1="303" x2="300" y2="400" stroke="#db2777" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="300" cy="400" r="3.2" fill="#db2777"/>
  <text x="80" y="300">Stomach — digests food with acid and enzymes</text>
</g>
<text x="450" y="572" text-anchor="middle" font-size="12.5" fill="#475569">If the kidneys fail, waste builds up in the blood — dialysis or a transplant is needed.</text>
</svg>
