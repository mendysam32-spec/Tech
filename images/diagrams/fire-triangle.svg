<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
</defs>
<text x="360" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The Fire Triangle</text>
<polygon points="360,90 640,470 80,470" fill="none" stroke="#64748b" stroke-width="3"/>
<polygon points="360,90 640,470 80,470" fill="#fef2f2" opacity=".6"/>
<path d="M360 96 L624 458 L96 458 Z" fill="none" stroke="#f97316" stroke-width="26" opacity=".65"/>
<path d="M360 96 L96 458 L624 458" fill="none" stroke="#dc2626" stroke-width="10" opacity=".8"/>
<text x="100" y="392" font-size="20" font-weight="700" fill="#9f1239" transform="rotate(36 100 392)">FUEL</text>
<text x="620" y="392" font-size="20" font-weight="700" fill="#9f1239" transform="rotate(-36 620 392)">OXYGEN</text>
<text x="360" y="376" font-size="20" font-weight="700" fill="#9f1239">(air)</text>
<text x="360" y="500" text-anchor="middle" font-size="20" font-weight="700" fill="#ea580c">HEAT</text>
<circle cx="360" cy="262" r="72" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
<text x="360" y="256" text-anchor="middle" font-size="24" font-weight="800" fill="#dc2626">FIRE</text>
<text x="360" y="298" text-anchor="middle" font-size="12.5" fill="#b91c1c">fuels + air + heat together</text>
<text x="360" y="545" text-anchor="middle" font-size="13.5" fill="#334155">Remove any ONE side (fuel, oxygen or heat) and the fire goes out.</text>
</svg>