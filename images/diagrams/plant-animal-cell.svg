<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<text x="440" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Plant Cell vs Animal Cell (simplified)</text>
<text x="200" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">PLANT CELL</text>
<rect x="40" y="100" width="320" height="300" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
<rect x="58" y="118" width="284" height="264" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<rect x="140" y="180" width="120" height="120" rx="18" fill="#bae6fd" opacity="0.75" stroke="#0ea5e9" stroke-width="2"/>
<circle cx="200" cy="250" r="36" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="200" cy="250" r="7" fill="#6d28d9"/>
<ellipse cx="90" cy="150" rx="20" ry="12" fill="#6ee7b7"/><ellipse cx="120" cy="340" rx="22" ry="13" fill="#6ee7b7"/><ellipse cx="300" cy="140" rx="20" ry="12" fill="#6ee7b7"/><ellipse cx="310" cy="360" rx="20" ry="12" fill="#6ee7b7"/>
<text x="600" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">ANIMAL CELL</text>
<ellipse cx="600" cy="270" rx="150" ry="170" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
<ellipse cx="600" cy="270" rx="140" ry="160" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
<circle cx="600" cy="260" r="42" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="600" cy="260" r="8" fill="#6d28d9"/>
<g font-size="12.5" fill="#334155">
<line x1="76" y1="133" x2="60" y2="140" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="60" cy="140" r="3.2" fill="#16a34a"/>
  <text x="70" y="130">Cell wall (plant only) — gives rigid support</text>
  <line x1="76" y1="157" x2="74" y2="152" stroke="#4ade80" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="74" cy="152" r="3.2" fill="#4ade80"/>
  <text x="70" y="154">Cell membrane — controls what enters and leaves the cell</text>
  <line x1="158" y1="193" x2="200" y2="216" stroke="#0ea5e9" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="200" cy="216" r="3.2" fill="#0ea5e9"/>
  <text x="152" y="190">Large vacuole (plant only) — stores water and salts</text>
  <line x1="26" y1="431" x2="170" y2="280" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="170" cy="280" r="3.2" fill="#7c3aed"/>
  <text x="20" y="428">Nucleus — control centre; holds the genetic material</text>
  <line x1="278" y1="131" x2="305" y2="140" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="305" cy="140" r="3.2" fill="#16a34a"/>
  <text x="272" y="128">Chloroplasts (plant only) — make food by photosynthesis</text>
  <line x1="476" y1="277" x2="740" y2="275" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="740" cy="275" r="3.2" fill="#2563eb"/>
  <text x="470" y="274">Animal cell: cell membrane only — no cell wall</text>
  <line x1="506" y1="421" x2="600" y2="245" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="600" cy="245" r="3.2" fill="#7c3aed"/>
  <text x="500" y="418">Nucleus — same job as in the plant cell</text>
  <line x1="206" y1="359" x2="660" y2="330" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="660" cy="330" r="3.2" fill="#60a5fa"/>
  <text x="200" y="356">Cytoplasm — jelly-like fluid holding the organelles</text>
</g>
</svg>
