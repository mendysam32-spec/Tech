<text x="230" y="580" text-anchor="middle" font-size="12.5" fill="#334155">Opposite charges attract → ionic lattice (e.g. NaCl).</text>
<g>
  <circle cx="600" cy="200" r="34" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="664" cy="200" r="34" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="600" cy="200" r="7" fill="#86efac"/><circle cx="664" cy="200" r="7" fill="#86efac"/>
  <circle cx="645" cy="192" r="6" fill="#86efac"/><circle cx="645" cy="208" r="6" fill="#86efac"/>
  <path d="M622 200 H650" stroke="#16a34a" stroke-width="5"/>
  <text x="632" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">shared pair of electrons</text>
  <text x="632" y="252" text-anchor="middle" font-size="12">H + H → H—H (H₂)</text>
</g>
<text x="680" y="300" text-anchor="middle" font-size="12.5" fill="#475569" width="240">Each hydrogen atom shares one electron so the pair is owned by both.</text>
<g>
  <circle cx="680" cy="440" r="70" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" style="stroke-dasharray:6 5"/>
  <text x="680" y="444" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Covalent bond</text>
  <text x="680" y="466" text-anchor="middle" font-size="12" fill="#475569">formed between two</text>
  <text x="680" y="484" text-anchor="middle" font-size="12" fill="#475569">non-metals (e.g. H₂, O₂, H₂O)</text>
</g>
<text x="680" y="548" text-anchor="middle" font-size="12.5" fill="#334155">NaCl conducts when molten because Na⁺ and Cl⁻ are free to move.</text>
</svg>