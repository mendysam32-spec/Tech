<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="Segoe UI, Arial, sans-serif"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
</defs>
<text x="460" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The Scientific Method — steps in order</text>

<g>
  <rect x="10" y="120" width="150" height="92" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="152" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1d4ed8">Observation</text>
  <text x="85" y="178" text-anchor="middle" font-size="12.5" fill="#475569">look closely, notice &amp; describe</text>
</g>
<g>
  <rect x="192" y="120" width="150" height="92" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="267" y="152" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1d4ed8">Question</text>
  <text x="267" y="178" text-anchor="middle" font-size="12.5" fill="#475569">ask: what / how / why?</text>
</g>
<g>
  <rect x="374" y="120" width="150" height="92" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="449" y="152" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1d4ed8">Hypothesis</text>
  <text x="449" y="178" text-anchor="middle" font-size="12.5" fill="#475569">a testable 'educated guess'</text>
</g>
<g>
  <rect x="556" y="120" width="150" height="92" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="631" y="152" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1d4ed8">Experiment</text>
  <text x="631" y="178" text-anchor="middle" font-size="12.5" fill="#475569">test it under fair conditions</text>
</g>
<g>
  <rect x="738" y="120" width="150" height="92" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="813" y="152" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1d4ed8">Conclusion</text>
  <text x="813" y="178" text-anchor="middle" font-size="12.5" fill="#475569">support or reject the idea</text>
</g>
<path d="M160 166 L186 166" class="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M342 166 L368 166" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M524 166 L550 166" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<path d="M706 166 L732 166" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="460" y="250" text-anchor="middle" font-size="13.5" fill="#334155">The experiment gives results that are analysed to draw a conclusion — if the hypothesis fails, the cycle starts again.</text>
</svg>