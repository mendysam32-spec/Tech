<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tech Monster | S&P Group</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
<nav class="navbar navbar-dark shadow-sm">
    <div class="container">
        <span class="app-logo">Tech Monster</span>
        <span class="small">Created by S&amp;P Group</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="glass-card p-4">
                <h3 class="fw-bold mb-3">Enter the Arena</h3>
                <p>Use only username and password. Admin, teacher, and student accounts all enter here.</p>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="loginUsername" class="form-control" autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" autocomplete="current-password" minlength="3" required>
                        <small class="opacity-75">New student accounts are created automatically.</small>
                    </div>
                    <div id="loginMessage" class="small mb-3"></div>
                    <button class="glass-btn w-100" type="submit">Login</button>
                </form>
            </div>
        </div>
        <div class="col-md-6">
            <div class="glass-card p-4">
                <h3 class="fw-bold mb-3">Hall of Fame</h3>
                <ol id="hallOfFame" class="list-group list-group-numbered hall-list">
                    <li class="list-group-item bg-transparent text-white border-0">No legends yet</li>
                </ol>
            </div>
        </div>
    </div>
</div>
<footer class="brand-footer signature-footer"><span class="signature-mark">S&amp;P Group</span><span class="signature-line">Created by S&amp;P Groups • Tech Monster Signature</span></footer>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
